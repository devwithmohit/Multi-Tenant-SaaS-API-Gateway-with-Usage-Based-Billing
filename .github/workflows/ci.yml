name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, usage-processor, billing-engine, dashboard-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        working-directory: services/${{ matrix.service }}
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [gateway, usage-processor, billing-engine, dashboard-api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Kafka C library (gateway only)
        if: matrix.service == 'gateway' || matrix.service == 'usage-processor'
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    strategy:
      matrix:
        service: [gateway, usage-processor, billing-engine, dashboard-api]
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test_db?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Kafka C library
        if: matrix.service == 'gateway' || matrix.service == 'usage-processor'
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [gateway, usage-processor, billing-engine, dashboard-api]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t saas-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint 2>/dev/null || true

      - name: Build
        run: npm run build
