version: "3.9"

services:
  # ============ Infrastructure ============
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 5

  # ============ Application Services ============
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://saas:saas_password@postgres:5432/saas_gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: usage-events
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  usage-processor:
    build:
      context: ./services/usage-processor
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://saas:saas_password@postgres:5432/saas_gateway?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: usage-events
      KAFKA_GROUP_ID: usage-processor-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  billing-engine:
    build:
      context: ./services/billing-engine
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://saas:saas_password@postgres:5432/saas_gateway?sslmode=disable
      RUN_SCHEDULE: "0 0 2 1 * *"
      PROCESS_MONTH: auto
      DRY_RUN: "false"
      STRIPE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-api:
    build:
      context: ./services/dashboard-api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://saas:saas_password@postgres:5432/saas_gateway?sslmode=disable
      JWT_SECRET: dev-secret-change-me-in-production
      JWT_ISSUER: saas-gateway
    depends_on:
      postgres:
        condition: service_healthy

  # ============ Monitoring ============
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  grafana_data:
